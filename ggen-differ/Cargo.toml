[package]
name = "ggen-differ"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Ontology diff and merge tool with git-like interface for TTL/RDF files"
license = "MIT OR Apache-2.0"

[dependencies]
# Error handling
thiserror = "2.0"

# Parsing
nom = "7.1"

# Graph analysis
petgraph = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hashing and collections
indexmap = "2.0"
rustc-hash = "2.0"

# CLI (optional)
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.4"
tempfile = "3.8"

[features]
default = []
cli = ["dep:clap"]

[[bin]]
name = "ggen-differ"
path = "src/bin/main.rs"
required-features = ["cli"]

[lib]
name = "ggen_differ"
path = "src/lib.rs"
