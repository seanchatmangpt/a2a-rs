[package]
name = "osiris-marketplace"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
path = "src/lib.rs"

[[bin]]
name = "osiris-marketplace"
path = "src/main.rs"
required-features = ["pubsub", "procurement-api"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# HTTP client
reqwest = { version = "0.12", features = ["json"], optional = true }

# Google Cloud Pub/Sub
google-cloud-pubsub = { version = "0.30", optional = true }
google-cloud-gax = { version = "1.6", optional = true }

# Google Cloud Service Control (Usage Reporting)
google-servicecontrol1 = { version = "5.0", optional = true }
yup-oauth2 = { version = "8", optional = true }

# Logging
tracing = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Base64 encoding/decoding
base64 = "0.22"

# Web server (for binary only)
axum = { version = "0.7", features = ["json"], optional = true }
tower-http = { version = "0.6", features = ["trace", "cors"], optional = true }
tower = { version = "0.5", optional = true }
dotenvy = { version = "0.15", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"], optional = true }

[features]
default = []
pubsub = ["google-cloud-pubsub", "google-cloud-gax"]
procurement-api = ["reqwest"]
service-control = ["google-servicecontrol1", "yup-oauth2"]
server = ["axum", "tower-http", "tower", "dotenvy", "tracing-subscriber"]
full = ["pubsub", "procurement-api", "service-control", "server"]

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
