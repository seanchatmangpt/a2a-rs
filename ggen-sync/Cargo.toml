[package]
name = "ggen-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
sophia_api = "0.8"
sophia_turtle = "0.8"
walkdir = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tera = "1.20"
oxigraph = "0.4"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.8"
