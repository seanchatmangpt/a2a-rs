[package]
name = "a2a-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Emil Lindfors <emil@lindfors.no>"]
description = "WebAssembly bindings for A2A construct runtime"
license = "MIT"
repository = "https://github.com/emillindfors/a2a-rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
a2a-rs = { path = "../a2a-rs", default-features = false, features = ["receipts"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = { version = "0.1", optional = true }
wee_alloc = { version = "0.4", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["dep:console_error_panic_hook"]
wee_alloc = ["dep:wee_alloc"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
