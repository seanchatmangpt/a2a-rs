[package]
name = "a2a-integration-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Workspace members
osiris-compiler = { path = "../osiris-compiler" }
osiris-edge = { path = "../osiris-edge" }
a2a-rs = { path = "../a2a-rs", features = ["full"] }

# Testing framework
tokio = { version = "1.32", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
async-trait = "0.1"
futures = "0.3"

# HTTP testing
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
hyper = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.4", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Test utilities
testcontainers = "0.17"
testcontainers-modules = { version = "0.5", features = ["postgres", "redis"] }

# Error handling
thiserror = "1.0"

# Property-based testing
proptest = "1.4"

# Standard library extensions
rand = "0.8"

[[test]]
name = "integration"
path = "integration/lib.rs"

[[test]]
name = "unit-domain"
path = "unit/mod.rs"

[[test]]
name = "unit-port"
path = "unit/port/mod.rs"
