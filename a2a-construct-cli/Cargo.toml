[package]
name = "a2a-construct-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["A2A Contributors"]
description = "CLI for A2A CONSTRUCT runtime operations"
license = "MIT OR Apache-2.0"

[[bin]]
name = "a2a-construct"
path = "src/main.rs"

[dependencies]
# Workspace crate
a2a-rs = { path = "../a2a-rs", features = ["receipts", "tracing"] }

# CLI framework
clap = { version = "4.5", features = ["derive", "cargo"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID generation
uuid = { version = "1.11", features = ["v4", "serde"] }
