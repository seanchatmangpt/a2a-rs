[package]
name = "a2a-loadtest"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
# Core A2A library with HTTP client
a2a-rs = { path = "../a2a-rs", features = ["http-client", "tracing"] }

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Command line parsing
clap = { version = "4.5", features = ["derive"] }

# Metrics and statistics
hdrhistogram = "7.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Time utilities
chrono = "0.4"

# Random data generation
uuid = { version = "1.11", features = ["v4"] }
rand = "0.8"

# CSV output
csv = "1.3"
