[package]
name = "ggen-optimizer"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "SPARQL CONSTRUCT query optimizer with static analysis and rewriting"
license = "MIT OR Apache-2.0"

[dependencies]
# Error handling
thiserror = "2.0"

# Parsing
nom = "7.1"

# Graph analysis
petgraph = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hashing and collections
indexmap = "2.0"
rustc-hash = "2.0"

[dev-dependencies]
proptest = "1.4"

[lib]
name = "ggen_optimizer"
path = "src/lib.rs"
