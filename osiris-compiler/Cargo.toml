[package]
name = "osiris-compiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Emil Lindfors <emil@lindfors.no>"]
description = "Deterministic compiler for Osiris protocol operations"
license = "MIT"
repository = "https://github.com/emillindfors/a2a-rs"
keywords = ["compiler", "deterministic", "osiris"]
categories = ["compilers"]

[dependencies]
# Core dependencies
# a2a-rs = { path = "../a2a-rs", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
uuid = { version = "1.4", features = ["v4", "serde"] }
bon = "2.3"

# Async foundation
tokio = { version = "1.32", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
async-trait = "0.1"

# Server
axum = "0.8"

# AI/LLM
genai = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Cryptography
sha2 = "0.10"
base64 = "0.22"

# Cloud services (optional)
google-cloudkms1 = { version = "5.0", optional = true }
hyper = { version = "1.0", optional = true }
hyper-rustls = { version = "0.27", optional = true }
yup-oauth2 = { version = "11.0", optional = true }

[features]
default = ["tokio-runtime", "tracing"]
tokio-runtime = []
tracing = []
kms = ["google-cloudkms1", "hyper", "hyper-rustls", "yup-oauth2"]
storage = []

[dev-dependencies]
proptest = "1.4"
proptest-derive = "0.5"

[[bin]]
name = "osiris-compiler"
path = "src/main.rs"

[lib]
name = "osiris_compiler"
path = "src/lib.rs"
