[package]
name = "a2a-rs-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["A2A Contributors"]
description = "Procedural macros for a2a-rs stations and guards"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chrishayuk/a2a-rs"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
a2a-rs = { path = "../a2a-rs" }
